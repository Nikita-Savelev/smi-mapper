apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{PROJECT_NAME}}
  namespace: {{NAMESPACE}}
spec:
  replicas: {{REPLICAS}}
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: {{PROJECT_NAME}}
  strategy:
    rollingUpdate:
      maxSurge: 100%
      maxUnavailable: 100%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: {{PROJECT_NAME}}
    spec:
      containers:
      - name: {{PROJECT_NAME}}
        image: {{IMAGE}}
        imagePullPolicy: Always
        volumeMounts: 
          - name: smi-config-vol
            mountPath: /usr/project/src/config/config.ini
            subPath: config.ini
      restartPolicy: Always
      volumes:
        - name: smi-config-vol
          configMap:
            name: smi-config-mapper
            items: 
              - key: config.ini
                path: config.ini
