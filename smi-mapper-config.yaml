kind: ConfigMap
apiVersion: v1
metadata:
  name: smi-config-mapper
  namespace: dataspace
data:
  config.ini: |
    [NewsCollector]
    mode = auto
    semaphore = 4

    [NewsParser]
    semaphore = 4

    [Workers]
    workers = auto
    api_workers = 2

    [Arango]
    arangoURL =
    username =
    password =
    db_name =
    collection_channels_name =
    collection_proxy_name =

    [Sentry]
    dsn =

    [LLM]
    enabled = false
    api_key =
    base_url = https://api.openai.com/v1
    model = gpt-4o-mini
    top_k = 5
    max_home_links = 150
    timeout_sec = 90
