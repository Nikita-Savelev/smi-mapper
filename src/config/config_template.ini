[NewsCollector]
mode = auto
semaphore = 4

[NewsParser]
semaphore = 4

# workers: число процессов сборки карт, либо auto (= cpu_count - 2)
# api_workers: gunicorn workers для health/metrics
[Workers]
workers = auto
api_workers = 2

[Arango]
arangoURL =
username =
password =
db_name =
collection_channels_name =
collection_proxy_name =

[Sentry]
dsn =

# LLM fallback for collector map (group E). Off by default.
# OpenAI-compatible chat API (api_key required when enabled=true).
# Channel seed force_llm=true skips RSS+HTML and goes straight to this path.
[LLM]
enabled = false
api_key =
base_url = https://api.openai.com/v1
model = gpt-4o-mini
top_k = 5
max_home_links = 150
timeout_sec = 90
